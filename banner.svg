<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Buildo Tecnologia - site, app e automacao">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117">
        <animate attributeName="stop-color" values="#0D1117;#150F2E;#0D1117" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#2B1B5A">
        <animate attributeName="stop-color" values="#2B1B5A;#4C1D95;#2B1B5A" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C5CFF">
        <animate attributeName="stop-color" values="#7C5CFF;#9F7BFF;#7C5CFF" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#0D1117" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.10"/>
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="280" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <rect width="1200" height="280" fill="url(#fade)"/>

    <g opacity="0.30">
      <path d="M0 214 C 180 178, 320 246, 520 214 C 720 182, 880 246, 1200 206 L1200 280 L0 280 Z" fill="#0D1117">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 6; 0 0" dur="9s" repeatCount="indefinite"/>
      </path>
    </g>
    <g opacity="0.55">
      <path d="M0 238 C 200 206, 380 268, 600 238 C 820 208, 980 264, 1200 234 L1200 280 L0 280 Z" fill="#0D1117">
        <animateTransform attributeName="transform" type="translate" values="0 0; 70 -5; 0 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(64, 108)">
      <rect x="0" y="-34" width="4" height="46" rx="2" fill="#A78BFA">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>

      <text x="22" y="0" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Buildo Tecnologia</text>

      <text x="22" y="38" font-family="Consolas, Menlo, Monaco, monospace" font-size="19" fill="#C9B8FF" letter-spacing="0.4">
        <tspan opacity="0">site que carrega antes do cliente desistir
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.30;0.33;1" dur="12s" repeatCount="indefinite"/>
        </tspan>
      </text>
      <text x="22" y="38" font-family="Consolas, Menlo, Monaco, monospace" font-size="19" fill="#C9B8FF" letter-spacing="0.4">
        <tspan opacity="0">app do MVP ate a publicacao na loja
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="12s" repeatCount="indefinite"/>
        </tspan>
      </text>
      <text x="22" y="38" font-family="Consolas, Menlo, Monaco, monospace" font-size="19" fill="#C9B8FF" letter-spacing="0.4">
        <tspan opacity="0">automacao que devolve hora pro time
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.69;0.96;0.99;1" dur="12s" repeatCount="indefinite"/>
        </tspan>
      </text>

      <rect x="22" y="24" width="9" height="18" fill="#7C5CFF">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="x" values="22;360;22" keyTimes="0;0.30;0.33" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(64, 196)" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#E6E0FF">
      <rect x="0" y="-14" width="112" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.10"/>
      <text x="16" y="4">Isaque, CEO</text>

      <rect x="124" y="-14" width="86" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.10"/>
      <text x="141" y="4">desde 2024</text>

      <rect x="222" y="-14" width="150" height="26" rx="13" fill="#7C5CFF" fill-opacity="0.35"/>
      <text x="239" y="4">aceitando projetos</text>
    </g>
  </g>
</svg>
